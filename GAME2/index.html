<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Pose - Stretch Rhythm Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1>Symphony Pose 🎵</h1>
    </div>

    <div class="game-container">
        <!-- หน้าจอเกม + แถบป้ายสี่เหลี่ยมผืนผ้าด้านบน -->
        <div class="canvas-section">

            <!-- 1. กล้องเว็บแคม -->
            <div class="camera-thumb">
                <canvas id="cameraCanvas" width="300" height="300"></canvas>
                <div id="loadingText">รอเชื่อมต่อกล้อง...</div>
            </div>

            <!-- 2. ข้อมูลคำอธิบายท่า และ สถานะเกม -->
            <div class="panel-info">
                <div class="legend-box">
                    <span>🔴 ยืดด้านซ้าย</span>
                    <span>🟡 ยืดชูขึ้น</span>
                    <span>🔵 ยืดด้านขวา</span>
                </div>

                <div class="status-box">
                    <div>เวลา: <span id="timeDisplay">0.0</span>s</div>
                    <div>คะแนน: <span id="scoreDisplay">0</span></div>
                    <div>ท่า: <span id="poseDisplay">-</span></div>
                </div>
            </div> <!-- 🚨 ✅ จุดสำคัญ: ต้องมีแท็กปิด </div> ของ panel-info ตรงนี้! -->

            <!-- 3. พื้นที่จอเกมหลัก (ต้องแยกตัวออกมาเป็นอิสระ) -->
            <div class="game-view">
                <canvas id="gameCanvas" width="450" height="600"></canvas>

                <!-- หน้าต่างเมนู/จบเกม -->
                <div id="gameMenuScreen" class="overlay">
                    <h2 id="menuTitle">พร้อมยืดเส้นหรือยัง?</h2>

                    <!-- ข้อความตอนกำลังโหลดโมเดล -->
                    <div id="menuLoadingText" class="hidden">กำลังเชื่อมต่อ AI และกล้อง... ⏳</div>

                    <!-- สถิติตอนจบเกม (ซ่อนไว้ก่อน) -->
                    <div id="gameOverStats" class="hidden">
                        <p>สาเหตุที่แพ้</p>
                        <p>เวลาที่รอด: <span id="finalTime">0</span> วินาที</p>
                        <p>คะแนนรวม: <span id="finalScore">0</span></p>
                    </div>
                    <!-- เนื้อหาอื่นๆ... -->
                    <button id="mainActionBtn" onclick="handleMenuAction()">เริ่มเกม</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
