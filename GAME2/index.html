<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Pose - Rhythm Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Symphony Pose 🎵</h1>
        <p>5 ท่าทาง | 3 เลน | ห้ามพลาดแม้แต่โน้ตเดียว!</p>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="init()">เริ่มเกม</button>
        <button id="restartBtn" onclick="restartGame()" disabled>เริ่มใหม่</button>
    </div>

    <div class="status-board">
        <div class="status-item">เวลา: <span id="timeDisplay">0.0</span> วินาที</div>
        <div class="status-item">คะแนน: <span id="scoreDisplay">0</span></div>
        <div class="status-item">ท่าทางปัจจุบัน: <span id="poseDisplay">-</span></div>
    </div>

    <div class="game-container">
        <!-- กล้องเว็บแคม -->
        <div class="camera-section">
            <canvas id="cameraCanvas" width="300" height="300"></canvas>
            <div id="loadingText">รอการเชื่อมต่อกล้อง...</div>
        </div>

        <!-- หน้าจอเกม -->
        <div class="canvas-section">
            <canvas id="gameCanvas" width="450" height="600"></canvas>
            
            <!-- หน้าต่างสรุปผลตอน Game Over -->
            <div id="gameOverScreen" class="overlay hidden">
                <h2>GAME OVER!</h2>
                <p>คุณทำท่าไม่ทัน หรือผิดท่า 😭</p>
                <p>เวลาที่เล่นได้: <span id="finalTime">0</span> วินาที</p>
                <p>คะแนนรวม: <span id="finalScore">0</span></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
