<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Pose - Stretch Rhythm Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="Logo Template.svg" alt="logo">
    </div>

    <div class="game-container">
        <div class="canvas-section">

            <!-- 1. กล้องเว็บแคม -->
            <div class="camera-thumb">
                <canvas id="cameraCanvas" width="300" height="300"></canvas>
                <div id="loadingText">รอเชื่อมต่อกล้อง...</div>
            </div>

            <!-- 2. ข้อมูลคำอธิบายท่า และ สถานะเกม -->
            <div class="panel-info">
                <div class="legend-box">
                    <span>🔴 ยืดแขน(ซ้าย/ขวา)</span>
                    <span>🟡 ชูแขนตรง </span>
                    <span>🔵 เอียงคอ(ซ้าย/ขวา)</span>
                </div>

                <div class="status-box">
                    <div>เวลา: <span id="timeDisplay">0.0</span>s</div>
                    <div>คะแนน: <span id="scoreDisplay">0</span></div>
                    <div>ท่า: <span id="poseDisplay">-</span></div>
                </div>
            </div>

            <!-- 3. พื้นที่จอเกมหลัก -->
            <div class="game-view">
                <canvas id="gameCanvas" width="550" height="600"></canvas>

                <!-- หน้าต่างเมนู/จบเกม -->
                <div id="gameMenuScreen" class="overlay">
                    <h2 id="menuTitle">พร้อมยืดเส้นหรือยัง?</h2>

                    <div id="gameOverStats" class="hidden">
                        <p>คุณทำท่ายืดเส้นไม่ทัน บาร์หมดไปแล้ว! 😭</p>
                        <p>เวลาที่เล่นได้: <span id="finalTime">0</span> วินาที</p>
                        <p>คะแนนรวม: <span id="finalScore">0</span></p>
                    </div>

                    <!-- ส่วนเลือกเพลงจากชุดที่ 1 -->
                    <div class="music-setup">
                        <h3>เลือกเพลง 🎵</h3>
                        <div id="songListContainer" class="song-list-grid"></div>
                    </div>

                    <button id="mainActionBtn" onclick="handleMenuAction()">เริ่มเกม</button>
                    <p id="menuLoadingText" class="hidden" style="color: #fee440; margin-top: 15px;">กำลังเชื่อมต่อ AI และกล้อง... ⏳</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
